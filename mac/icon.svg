<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: a small process flow over the app's time bar (solid = time that remains, hatched = time removed). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171817"/>
      <stop offset="0.42" stop-color="#171817"/>
      <stop offset="1" stop-color="#048a24"/>
    </linearGradient>
    <pattern id="hatch" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="15" height="34" fill="#adf07e"/>
    </pattern>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round">
    <!-- signal, step, decision -->
    <polygon points="212,300 352,300 392,350 352,400 212,400"/>
    <rect x="452" y="300" width="160" height="100" rx="10"/>
    <polygon points="742,272 812,350 742,428 672,350"/>
    <path d="M392 350 H452 M612 350 H672"/>
  </g>
  <rect x="212" y="560" width="330" height="130" fill="#fff"/>
  <rect x="542" y="560" width="270" height="130" fill="url(#hatch)"/>
  <rect x="212" y="560" width="600" height="130" fill="none" stroke="#fff" stroke-width="14"/>
</svg>
